services:
  mediamtx:
    image: webobs-m0-mediamtx:1.18.2-local
    build:
      context: ..
      dockerfile: tests/mediamtx-fixture/Dockerfile
      args:
        MEDIAMTX_VERSION: "1.18.2"
        MEDIAMTX_LINUX_AMD64_SHA256: 73ed27c292e05ceb4990dcb34531f01872dfff5374b7515c45a202e0abf47706

  fixture:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-test-stream"]
    environment:
      TEST_RTSP_URL: rtsp://mediamtx:8554/m0-test
    depends_on:
      - mediamtx

  fixture-hevc:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-hevc-stream"]
    environment:
      TEST_RTSP_URL: rtsp://mediamtx:8554/m3-hevc
    depends_on:
      - mediamtx

  fixture-audio-a:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-audio-stream"]
    environment:
      TEST_RTSP_URL: rtsp://mediamtx:8554/m5-audio-a
      TEST_AUDIO_FREQUENCY: "440"
    depends_on:
      - mediamtx

  fixture-audio-b:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-audio-stream"]
    environment:
      TEST_RTSP_URL: rtsp://mediamtx:8554/m5-audio-b
      TEST_AUDIO_FREQUENCY: "880"
      TEST_AUDIO_CODEC: aac
    depends_on:
      - mediamtx

  browser-fixture:
    image: webobs-m4-browser-fixture:local
    build:
      context: ..
      dockerfile: tests/browser-fixture/Dockerfile
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read(1)
      interval: 1s
      timeout: 3s
      retries: 20

  webobs:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    environment:
      WEBOBS_RTSP_URL: rtsp://mediamtx:8554/m0-test
      WEBOBS_OUTPUT: /artifacts/smoke.mp4
      WEBOBS_DURATION_SECONDS: "10"
      WEBOBS_WIDTH: "640"
      WEBOBS_HEIGHT: "360"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "30"
      WEBOBS_RTSP_TRANSPORT: tcp
      WEBOBS_LOG_LEVEL: info
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-multi:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /test-scenes/m1-two-up.json /test-config/scene.json && exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/multi.mp4
      WEBOBS_DURATION_SECONDS: "10"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "30"
      WEBOBS_LOG_LEVEL: info
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-control:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - chmod 0700 /test-config; test -f /test-config/scene.json || install -m 0600 /test-scenes/m1-two-up.json /test-config/scene.json; exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/control-plane.mp4
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "8"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
      - control-config:/test-config
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-webrtc:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    environment:
      WEBOBS_RTSP_URL: rtsp://mediamtx:8554/m0-test
      WEBOBS_OUTPUT: /artifacts/webrtc.mp4
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_WIDTH: "640"
      WEBOBS_HEIGHT: "360"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "30"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_WHIP_URL: http://127.0.0.1:8889/program/whip
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
    volumes:
      - ./artifacts:/artifacts
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:8189:8189/udp"
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-direct:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /test-scenes/m1-two-up.json /test-config/scene.json && exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/direct.mp4
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "8"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_WHIP_URL: http://127.0.0.1:8889/program/whip
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18082:8080"
      - "127.0.0.1:8189:8189/udp"
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-hybrid:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /test-scenes/m3-hybrid.json /test-config/scene.json && exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/${WEBOBS_HYBRID_RECORDING_NAME:-hybrid.mp4}
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "12"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_WHIP_URL: http://127.0.0.1:8889/program/whip
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18083:8080"
      - "127.0.0.1:8189:8189/udp"
    depends_on:
      - fixture
      - fixture-hevc
    stop_grace_period: 20s

  webobs-browser:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /test-scenes/m4-browser.json /test-config/scene.json && exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/${WEBOBS_BROWSER_RECORDING_NAME:-browser.mp4}
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "12"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "false"
      WEBOBS_BROWSER_ALLOWED_ORIGINS: http://browser-fixture:8080
      WEBOBS_BROWSER_ALLOW_PRIVATE_NETWORKS: "true"
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18084:8080"
    depends_on:
      browser-fixture:
        condition: service_healthy
    stop_grace_period: 20s

  webobs-audio:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - scene="$${WEBOBS_AUDIO_SCENE:-m5-audio-mix.json}"; case "$${scene}" in m5-audio-*.json) ;; *) exit 64 ;; esac; install -m 0600 "/test-scenes/$${scene}" /test-config/scene.json; exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_AUDIO_SCENE: ${WEBOBS_AUDIO_SCENE:-m5-audio-mix.json}
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/${WEBOBS_AUDIO_RECORDING_NAME:-m5-audio.mp4}
      WEBOBS_DURATION_SECONDS: ${WEBOBS_AUDIO_DURATION_SECONDS:-0}
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "12"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_WHIP_URL: http://127.0.0.1:8889/program/whip
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18085:8080"
      - "127.0.0.1:8189:8189/udp"
    depends_on:
      - fixture-audio-a
      - fixture-audio-b
    stop_grace_period: 20s

  webobs-auth:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - umask 077; printf '%s\n' 'm6-operator' > /test-config/auth-username; printf '%s\n' 'm6-public-test-password-1234' > /test-config/auth-password; install -m 0600 /test-scenes/m1-two-up.json /test-config/scene.json; exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/m6-auth.mp4
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_VIDEO_ENCODER: nvenc
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "8"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_AUTH_USERNAME_FILE: /test-config/auth-username
      WEBOBS_AUTH_PASSWORD_FILE: /test-config/auth-password
      WEBOBS_AUTH_FAILURE_LIMIT: "3"
      WEBOBS_AUTH_FAILURE_WINDOW_SECONDS: "2"
      WEBOBS_CONTROL_ALLOWED_ORIGINS: https://monitor.example.invalid
      WEBOBS_SOURCE_STALE_SECONDS: "2"
      WEBOBS_SOURCE_RECOVERY_BASE_SECONDS: "1"
      WEBOBS_SOURCE_RECOVERY_MAX_SECONDS: "4"
      WEBOBS_WEBRTC_ENABLED: "false"
    volumes:
      - ./artifacts:/artifacts
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18086:8080"
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-tls-turn:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /test-scenes/m1-two-up.json /test-config/scene.json && exec /opt/webobs/entrypoint.sh
    environment:
      WEBOBS_SCENE_FILE: /test-config/scene.json
      WEBOBS_OUTPUT: /artifacts/${WEBOBS_TLS_RECORDING_NAME:-m6-tls-turn.mp4}
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_FPS: "10"
      WEBOBS_BITRATE_KBPS: "800"
      WEBOBS_CONNECT_TIMEOUT_SECONDS: "8"
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 127.0.0.1
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "false"
      WEBOBS_AUTH_USERNAME_FILE: /test-secrets/auth-username
      WEBOBS_AUTH_PASSWORD_FILE: /test-secrets/auth-password
      WEBOBS_CONTROL_ALLOWED_ORIGINS: https://monitor.test:18443
      WEBOBS_TLS_ENABLED: "true"
      WEBOBS_TLS_CERT_FILE: /test-secrets/tls-cert.pem
      WEBOBS_TLS_KEY_FILE: /test-secrets/tls-key.pem
      WEBOBS_TLS_CA_FILE: /test-secrets/tls-cert.pem
      WEBOBS_TLS_SERVER_NAME: monitor.test
      WEBOBS_TLS_PUBLIC_AUTHORITY: monitor.test:18443
      WEBOBS_HTTPS_PORT: "8443"
      WEBOBS_TURN_URL: turn:relay.example.invalid:3478?transport=tcp
      WEBOBS_TURN_USERNAME_FILE: /test-secrets/turn-username
      WEBOBS_TURN_PASSWORD_FILE: /test-secrets/turn-password
      WEBOBS_TURN_CLIENT_ONLY: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_WHIP_URL: http://127.0.0.1:8889/program/whip
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
    volumes:
      - ./artifacts:/artifacts
      - ./artifacts/m6-tls-secrets:/test-secrets:ro
      - ./scenes:/test-scenes:ro
    tmpfs:
      - /test-config:mode=0700
    ports:
      - "127.0.0.1:18443:8443"
    depends_on:
      - fixture
    stop_grace_period: 20s

  webobs-real-control:
    image: webobs:m0
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
    environment:
      WEBOBS_RTSP_URL: ${WEBOBS_RTSP_URL:-}
      WEBOBS_SCENE_FILE: /config/webobs/scene.json
      WEBOBS_OUTPUT: /recordings/${WEBOBS_REAL_RECORDING_NAME:-m1-real-camera.mp4}
      WEBOBS_DURATION_SECONDS: "0"
      WEBOBS_WIDTH: ${WEBOBS_REAL_WIDTH:-1920}
      WEBOBS_HEIGHT: ${WEBOBS_REAL_HEIGHT:-1080}
      WEBOBS_FPS: ${WEBOBS_REAL_FPS:-30}
      WEBOBS_BITRATE_KBPS: ${WEBOBS_REAL_BITRATE_KBPS:-6000}
      WEBOBS_CONNECT_TIMEOUT_SECONDS: ${WEBOBS_REAL_CONNECT_TIMEOUT_SECONDS:-20}
      WEBOBS_RTSP_TRANSPORT: ${WEBOBS_REAL_RTSP_TRANSPORT:-tcp}
      WEBOBS_LOG_LEVEL: info
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
    volumes:
      - ../recordings:/recordings
      - real-control-config:/config/webobs
    stop_grace_period: 20s

  real-control-client:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/run-m1-real-control"]
    environment:
      CONTROL_BASE_URL: http://webobs-real-control:8080
      CONTROL_HOST: 127.0.0.1:8080
      CONTROL_ORIGIN: http://127.0.0.1:8080
      CONTROL_RTSP_URL: ${WEBOBS_RTSP_URL:-}
      CONTROL_RTSP_TRANSPORT: ${WEBOBS_REAL_RTSP_TRANSPORT:-tcp}
      CONTROL_WIDTH: ${WEBOBS_REAL_WIDTH:-1920}
      CONTROL_HEIGHT: ${WEBOBS_REAL_HEIGHT:-1080}
      CONTROL_TWO_UP_SECONDS: "3"

  validator:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/probe-recording"]
    environment:
      TEST_RECORDING: /artifacts/smoke.mp4
      TEST_REQUIRE_PILLARBOX: "1"
    volumes:
      - ./artifacts:/artifacts:ro

volumes:
  control-config:
  real-control-config:
