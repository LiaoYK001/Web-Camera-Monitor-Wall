services:
  camera:
    image: webobs-m0-mediamtx:1.18.2-local
    build:
      context: ..
      dockerfile: tests/mediamtx-fixture/Dockerfile
      args:
        MEDIAMTX_VERSION: "1.18.2"
        MEDIAMTX_LINUX_AMD64_SHA256: 73ed27c292e05ceb4990dcb34531f01872dfff5374b7515c45a202e0abf47706
    networks: [camera-media]

  publisher:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-test-stream"]
    environment:
      TEST_RTSP_URL: rtsp://camera:8554/v2-direct
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/webobs-publisher-ready || (timeout 8 ffprobe -v error -rtsp_transport tcp -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 rtsp://camera:8554/v2-direct | grep -qx h264 && touch /tmp/webobs-publisher-ready)"]
      interval: 1s
      timeout: 10s
      retries: 30
    depends_on: [camera]
    networks: [camera-media]

  publisher-hevc:
    image: webobs-m0-rtsp-fixture:local
    build:
      context: ..
      dockerfile: tests/rtsp-fixture/Dockerfile
    entrypoint: ["/usr/local/bin/publish-hevc-stream"]
    environment:
      TEST_RTSP_URL: rtsp://camera:8554/v2-direct-hevc
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/webobs-publisher-ready || (timeout 8 ffprobe -v error -rtsp_transport tcp -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 rtsp://camera:8554/v2-direct-hevc | grep -qx hevc && touch /tmp/webobs-publisher-ready)"]
      interval: 1s
      timeout: 10s
      retries: 30
    depends_on: [camera]
    networks: [camera-media]

  mjpeg-camera:
    image: webobs-v2-direct-fixture:local
    build:
      context: ..
      dockerfile: tests/v2-direct-fixture/Dockerfile
    entrypoint: ["python3", "/fixture/mjpeg_server.py"]
    networks: [camera-media]

  hls-warmup:
    image: webobs-v2-direct-fixture:local
    build:
      context: ..
      dockerfile: tests/v2-direct-fixture/Dockerfile
    entrypoint: ["python3", "/fixture/wait_hls.py"]
    environment:
      WEBOBS_FIXTURE_HLS: http://camera:8888/v2-direct/index.m3u8
    depends_on: [publisher]
    networks: [camera-media]

  webobs:
    image: ${WEBOBS_TEST_IMAGE:-webobs:v2-m1-dev}
    environment:
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "false"
      WEBOBS_COMPOSITE_ENABLED: "false"
      WEBOBS_NVR_ENABLED: "false"
      WEBOBS_EVENTS_ENABLED: "false"
      WEBOBS_CAMERA_REGISTRY_ENABLED: "true"
      WEBOBS_V2_CLIENT_CONTROL_ENABLED: "true"
    tmpfs:
      - /config/webobs:mode=0700
    volumes:
      - ./v2-direct-fixture/camera-credentials.json:/run/secrets/webobs-camera-credentials/v2-direct-fixture.json:ro
    networks: [control]
    stop_grace_period: 20s

  v2-probe:
    image: webobs-v2-direct-fixture:local
    build:
      context: ..
      dockerfile: tests/v2-direct-fixture/Dockerfile
    environment:
      WEBOBS_FIXTURE_CONTROL: http://webobs:8080
      WEBOBS_FIXTURE_RTSP: rtsp://camera:8554/v2-direct
    depends_on: [webobs, publisher]
    networks: [control, camera-media]

  webobs-fallback:
    image: ${WEBOBS_TEST_IMAGE:-webobs:v2-m1-dev}
    environment:
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "true"
      WEBOBS_COMPOSITE_ENABLED: "false"
      WEBOBS_NVR_ENABLED: "false"
      WEBOBS_EVENTS_ENABLED: "false"
      WEBOBS_CAMERA_REGISTRY_ENABLED: "true"
      WEBOBS_V2_CLIENT_CONTROL_ENABLED: "true"
      MTX_WEBRTCADDITIONALHOSTS: webobs-fallback
    tmpfs:
      - /config/webobs:mode=0700
    volumes:
      - ./v2-direct-fixture/camera-credentials.json:/run/secrets/webobs-camera-credentials/v2-direct-fixture.json:ro
    networks: [control, camera-media]
    stop_grace_period: 20s

  v2-fallback-probe:
    image: webobs-v2-direct-fixture:local
    environment:
      WEBOBS_FIXTURE_CONTROL: http://webobs-fallback:8080
      WEBOBS_FIXTURE_RTSP: rtsp://camera:8554/v2-direct
      WEBOBS_TEST_SERVER_FALLBACK: "true"
    depends_on: [webobs-fallback, publisher]
    networks: [control, camera-media]

  webobs-nvr-direct:
    image: ${WEBOBS_TEST_IMAGE:-webobs:v2-m1-dev}
    environment:
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: "8080"
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_WEBRTC_ENABLED: "false"
      WEBOBS_COMPOSITE_ENABLED: "false"
      WEBOBS_NVR_ENABLED: "true"
      WEBOBS_NVR_CONFIG: /fixture-config/nvr.json
      WEBOBS_NVR_STORAGE: /recordings/nvr
      WEBOBS_EVENTS_ENABLED: "false"
      WEBOBS_CAMERA_REGISTRY_ENABLED: "true"
      WEBOBS_V2_CLIENT_CONTROL_ENABLED: "true"
    tmpfs:
      - /config/webobs:mode=0700
      - /recordings/nvr:mode=0700
    volumes:
      - ./v2-direct-fixture/nvr.json:/fixture-config/nvr.json:ro
    depends_on: [publisher]
    networks: [control, camera-media]
    stop_grace_period: 20s

  v2-nvr-coexist-probe:
    image: webobs-v2-direct-fixture:local
    entrypoint: ["python3", "/fixture/nvr_coexist_probe.py"]
    environment:
      WEBOBS_FIXTURE_CONTROL: http://webobs-nvr-direct:8080
      WEBOBS_FIXTURE_RTSP: rtsp://camera:8554/v2-direct
    depends_on: [webobs-nvr-direct, publisher]
    networks: [control, camera-media]

  native-rtsp-h264:
    image: webobs-native-protocol-fixture:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: client-protocol-test
    environment:
      WEBOBS_PROBE_ADAPTER: rtsp
      WEBOBS_PROBE_CODEC: h264
      WEBOBS_PROBE_ENDPOINT: rtsp://camera:8554/v2-direct
    depends_on:
      publisher:
        condition: service_healthy
    networks: [camera-media]

  native-rtsp-h265:
    image: webobs-native-protocol-fixture:local
    environment:
      WEBOBS_PROBE_ADAPTER: rtsp
      WEBOBS_PROBE_CODEC: h265
      WEBOBS_PROBE_ENDPOINT: rtsp://camera:8554/v2-direct-hevc
    depends_on:
      publisher-hevc:
        condition: service_healthy
    networks: [camera-media]

  native-mjpeg:
    image: webobs-native-protocol-fixture:local
    environment:
      WEBOBS_PROBE_ADAPTER: mjpeg
      WEBOBS_PROBE_CODEC: mjpeg
      WEBOBS_PROBE_ENDPOINT: http://mjpeg-camera:8000/camera.mjpeg
    depends_on: [mjpeg-camera]
    networks: [camera-media]

  native-hls:
    image: webobs-native-protocol-fixture:local
    environment:
      WEBOBS_PROBE_ADAPTER: hls
      WEBOBS_PROBE_CODEC: h264
      WEBOBS_PROBE_ENDPOINT: http://camera:8888/v2-direct/index.m3u8
    depends_on:
      hls-warmup:
        condition: service_completed_successfully
    networks: [camera-media]

  native-batch:
    image: webobs-native-protocol-fixture:local
    entrypoint: ["/build/clients/webobs-native", "--probe-manifest", "/fixture/native-batch.json"]
    volumes:
      - ./v2-direct-fixture/native-batch.json:/fixture/native-batch.json:ro
    depends_on:
      publisher:
        condition: service_healthy
    networks: [camera-media]

  native-reconnect:
    image: webobs-native-protocol-fixture:local
    entrypoint: ["/build/clients/webobs-native", "--probe-manifest", "/fixture/native-reconnect.json", "--probe-reconnect"]
    volumes:
      - ./v2-direct-fixture/native-reconnect.json:/fixture/native-reconnect.json:ro
    depends_on:
      publisher:
        condition: service_healthy
    networks: [camera-media]

  native-lifecycle:
    image: webobs-native-protocol-fixture:local
    entrypoint:
      - sh
      - -ceu
      - |
        : > /tmp/webobs-lifecycle-command
        exec /build/clients/webobs-native \
          --probe-manifest /fixture/native-reconnect.json \
          --probe-background-release \
          --probe-foreground-resume \
          --probe-lifecycle-trigger /tmp/webobs-lifecycle-command
    volumes:
      - ./v2-direct-fixture/native-reconnect.json:/fixture/native-reconnect.json:ro
    depends_on:
      publisher:
        condition: service_healthy
    networks: [camera-media]

networks:
  control:
    internal: true
  camera-media:
    internal: true
