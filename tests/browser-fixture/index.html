<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebOBS browser fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: white;
      font: 700 52px/1.2 sans-serif;
      background: linear-gradient(135deg, #075985 0 50%, #c2410c 50% 100%);
    }
    main { padding: 32px 48px; background: #111827dd; border: 6px solid #f8fafc; }
    i { display: inline-block; width: 30px; height: 30px; margin-right: 18px; background: #22c55e;
        animation: pulse 800ms steps(2, jump-none) infinite; }
    @keyframes pulse { to { background: #facc15; transform: rotate(90deg); } }
  </style>
</head>
<body><main><i></i>M4 BROWSER SOURCE</main></body>
</html>
