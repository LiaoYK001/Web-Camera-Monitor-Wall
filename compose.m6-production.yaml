services:
  webobs:
    environment:
      WEBOBS_LISTEN_ADDRESS: 127.0.0.1
      WEBOBS_ALLOW_INSECURE_REMOTE: "false"
      WEBOBS_TLS_ENABLED: "true"
      WEBOBS_TLS_CERT_FILE: /run/secrets/webobs_tls_certificate
      WEBOBS_TLS_KEY_FILE: /run/secrets/webobs_tls_private_key
      WEBOBS_TLS_SERVER_NAME: ${WEBOBS_TLS_SERVER_NAME:?set WEBOBS_TLS_SERVER_NAME}
      WEBOBS_TLS_PUBLIC_AUTHORITY: ${WEBOBS_TLS_PUBLIC_AUTHORITY:?set WEBOBS_TLS_PUBLIC_AUTHORITY}
      WEBOBS_HTTPS_PORT: ${WEBOBS_HTTPS_PORT:-8443}
      WEBOBS_AUTH_USERNAME_FILE: /run/secrets/webobs_auth_username
      WEBOBS_AUTH_PASSWORD_FILE: /run/secrets/webobs_auth_password
      WEBOBS_SESSION_COOKIE_SECURE: "true"
      WEBOBS_CONTROL_ALLOWED_ORIGINS: ${WEBOBS_CONTROL_ALLOWED_ORIGINS:?set WEBOBS_CONTROL_ALLOWED_ORIGINS}
      WEBOBS_TURN_URL: ${WEBOBS_TURN_URL:?set WEBOBS_TURN_URL}
      WEBOBS_TURN_USERNAME_FILE: /run/secrets/webobs_turn_username
      WEBOBS_TURN_PASSWORD_FILE: /run/secrets/webobs_turn_password
      WEBOBS_TURN_CLIENT_ONLY: ${WEBOBS_TURN_CLIENT_ONLY:-false}
      MTX_WEBRTCADDITIONALHOSTS: ${WEBOBS_WEBRTC_ADDITIONAL_HOSTS:?set WEBOBS_WEBRTC_ADDITIONAL_HOSTS}
    secrets:
      - webobs_tls_certificate
      - webobs_tls_private_key
      - webobs_auth_username
      - webobs_auth_password
      - webobs_turn_username
      - webobs_turn_password
    ports: !override
      - "${WEBOBS_BIND_ADDRESS:-0.0.0.0}:${WEBOBS_HTTPS_PORT:-8443}:${WEBOBS_HTTPS_PORT:-8443}"
      - "${WEBOBS_BIND_ADDRESS:-0.0.0.0}:${WEBOBS_WEBRTC_UDP_PORT:-8189}:8189/udp"

secrets:
  webobs_tls_certificate:
    file: ${WEBOBS_TLS_CERTIFICATE_SOURCE:?set WEBOBS_TLS_CERTIFICATE_SOURCE}
  webobs_tls_private_key:
    file: ${WEBOBS_TLS_PRIVATE_KEY_SOURCE:?set WEBOBS_TLS_PRIVATE_KEY_SOURCE}
  webobs_auth_username:
    file: ${WEBOBS_AUTH_USERNAME_SOURCE:?set WEBOBS_AUTH_USERNAME_SOURCE}
  webobs_auth_password:
    file: ${WEBOBS_AUTH_PASSWORD_SOURCE:?set WEBOBS_AUTH_PASSWORD_SOURCE}
  webobs_turn_username:
    file: ${WEBOBS_TURN_USERNAME_SOURCE:?set WEBOBS_TURN_USERNAME_SOURCE}
  webobs_turn_password:
    file: ${WEBOBS_TURN_PASSWORD_SOURCE:?set WEBOBS_TURN_PASSWORD_SOURCE}
