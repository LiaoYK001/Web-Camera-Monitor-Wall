logLevel: info
logDestinations: [stdout]
logStructured: false

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: [127.0.0.1, ::1]
    permissions:
      - action: publish
        path: program
      - action: read
        path: program

api: false
metrics: false
pprof: false
playback: false

rtsp: false
rtmp: false
hls: false
srt: false

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins: ['*']
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []
# OBS initializes x264 before its asynchronous WHIP handshake. Allow the next
# fixed two-second IDR to arrive without forcing a needless first reconnect.
webrtcTrackGatherTimeout: 5s

pathDefaults:
  source: publisher
  overridePublisher: false

paths:
  program:
