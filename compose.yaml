services:
  webobs:
    image: ${WEBOBS_IMAGE:-webobs:m0}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        OBS_VERSION: "32.1.2"
        MEDIAMTX_VERSION: "1.18.2"
        MEDIAMTX_LINUX_AMD64_SHA256: 73ed27c292e05ceb4990dcb34531f01872dfff5374b7515c45a202e0abf47706
        LIBDATACHANNEL_VERSION: "0.21.0"
        LIBDATACHANNEL_COMMIT: 9d5c46b8f506943727104d766e5dad0693c5a223
    environment:
      WEBOBS_RTSP_URL: ${WEBOBS_RTSP_URL:-}
      WEBOBS_SCENE_FILE: ${WEBOBS_SCENE_FILE:-/config/webobs/scene.json}
      WEBOBS_LISTEN_ADDRESS: 0.0.0.0
      WEBOBS_HTTP_PORT: ${WEBOBS_HTTP_PORT:-8080}
      WEBOBS_ALLOW_INSECURE_REMOTE: "true"
      WEBOBS_OUTPUT: ${WEBOBS_OUTPUT:-}
      WEBOBS_DURATION_SECONDS: ${WEBOBS_DURATION_SECONDS:-0}
      WEBOBS_WIDTH: ${WEBOBS_WIDTH:-1920}
      WEBOBS_HEIGHT: ${WEBOBS_HEIGHT:-1080}
      WEBOBS_FPS: ${WEBOBS_FPS:-30}
      WEBOBS_BITRATE_KBPS: ${WEBOBS_BITRATE_KBPS:-6000}
      WEBOBS_VIDEO_ENCODER: ${WEBOBS_VIDEO_ENCODER:-auto}
      WEBOBS_VAAPI_DEVICE: ${WEBOBS_VAAPI_DEVICE:-/dev/dri/renderD128}
      WEBOBS_CONNECT_TIMEOUT_SECONDS: ${WEBOBS_CONNECT_TIMEOUT_SECONDS:-20}
      WEBOBS_RTSP_TRANSPORT: ${WEBOBS_RTSP_TRANSPORT:-tcp}
      WEBOBS_LOG_LEVEL: ${WEBOBS_LOG_LEVEL:-info}
      WEBOBS_SOURCE_STALE_SECONDS: ${WEBOBS_SOURCE_STALE_SECONDS:-10}
      WEBOBS_SOURCE_RECOVERY_BASE_SECONDS: ${WEBOBS_SOURCE_RECOVERY_BASE_SECONDS:-5}
      WEBOBS_SOURCE_RECOVERY_MAX_SECONDS: ${WEBOBS_SOURCE_RECOVERY_MAX_SECONDS:-60}
      WEBOBS_BROWSER_ALLOWED_ORIGINS: ${WEBOBS_BROWSER_ALLOWED_ORIGINS:-}
      WEBOBS_BROWSER_ALLOW_PRIVATE_NETWORKS: ${WEBOBS_BROWSER_ALLOW_PRIVATE_NETWORKS:-false}
      WEBOBS_WEBRTC_ENABLED: ${WEBOBS_WEBRTC_ENABLED:-true}
      WEBOBS_NVR_ENABLED: ${WEBOBS_NVR_ENABLED:-false}
      WEBOBS_NVR_CONFIG: ${WEBOBS_NVR_CONFIG:-/config/webobs/nvr.json}
      WEBOBS_NVR_STORAGE: ${WEBOBS_NVR_STORAGE:-/recordings/nvr}
      WEBOBS_WHIP_URL: ${WEBOBS_WHIP_URL:-http://127.0.0.1:8889/program/whip}
      MTX_WEBRTCADDITIONALHOSTS: ${WEBOBS_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}
    volumes:
      - webobs-config:/config/webobs
      - ./assets:/assets:ro
      - ./recordings:/recordings
    ports:
      - "${WEBOBS_BIND_ADDRESS:-127.0.0.1}:${WEBOBS_HTTP_PORT:-8080}:${WEBOBS_HTTP_PORT:-8080}"
      - "${WEBOBS_BIND_ADDRESS:-127.0.0.1}:${WEBOBS_WEBRTC_UDP_PORT:-8189}:8189/udp"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${WEBOBS_LOG_MAX_SIZE:-10m}
        max-file: ${WEBOBS_LOG_MAX_FILES:-3}

volumes:
  webobs-config:
