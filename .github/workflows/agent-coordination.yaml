name: Agent coordination consistency

on:
  pull_request:
    paths:
      - 'docs/coordination/**'
      - 'scripts/agent-sync.py'
      - 'tests/test_agent_sync.py'
      - 'AGENTS.md'
      - '.github/workflows/agent-coordination.yaml'
  push:
    branches: [dev, main]
    paths:
      - 'docs/coordination/**'
      - 'scripts/agent-sync.py'
      - 'tests/test_agent_sync.py'
      - 'AGENTS.md'
      - '.github/workflows/agent-coordination.yaml'

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check ledger views and concurrent ownership / 检查同步与并发认领
        run: |
          python3 -B scripts/agent-sync.py check
          python3 -B tests/test_agent_sync.py
