name: Build isolated OBS native frontend prototype

# Explicit, non-default prototype; no installer, release write or stable feed.
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      pixel_test: { type: boolean, default: false }
      measure_obs_baseline: { type: boolean, default: false }
      upgrade_previous: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      pixel_test:
        description: 'Compile a non-redistributable finite final-pixel harness; upload sanitized synthetic receipt only'
        type: boolean
        default: false
      measure_obs_baseline:
        description: 'Install the pinned stock OBS 32.1.2 installer and record a same-OS installed-size reference'
        type: boolean
        default: false
      upgrade_previous:
        description: 'Install the pinned previous prototype, upgrade it in place and verify the private profile survives'
        type: boolean
        default: false
      version:
        type: string
        required: true
        default: '4.1.0-dev.18'

permissions:
  contents: read
  actions: read

jobs:
  native-host:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify process accounting logic and actual Windows query APIs
        shell: pwsh
        run: |
          python -B native-host/qualification/test_qualification.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic process accounting contract failed.' }
          python -B native-host/qualification/test_windows_api.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows process query or private directory API failed; no performance qualification.' }
      - name: Preflight actual PowerShell capture compilation before other pixel contracts
        if: inputs.pixel_test
        shell: pwsh
        run: |
          pwsh -NoProfile -File native-host/tests/capture-pixels.ps1 -CompileOnly
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic capture preflight failed; no final pixels were captured.' }
      - name: Verify finite synthetic pixel-test contracts
        if: inputs.pixel_test
        shell: pwsh
        run: |
          python -B native-host/tests/test_pixels.py
          if ($LASTEXITCODE -ne 0) { throw 'Finite pixel-test contract failed.' }
      - name: Select existing VS compiler
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 not available on runner' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object Name -In @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion') | ForEach-Object { "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: Cache only hash-verified dependency archives
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: desktop/.cache/*.zip
          key: windows-2022-obs-native-${{ hashFiles('desktop/dependencies.lock.json', 'native-host/dependencies.lock.json') }}
          restore-keys: |
            windows-2022-obs-native-
            windows-2022-desktop-
      - name: Use Node only for synthetic test fixtures and pixel inspection
        if: inputs.pixel_test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Compile pinned OBS frontend and product plugin without legacy services
        shell: pwsh
        env:
          NATIVE_VERSION: ${{ inputs.version }}
          NATIVE_PIXEL_TEST: ${{ inputs.pixel_test }}
        run: |
          $parameters = @{Version=$env:NATIVE_VERSION;BuildDirectory="$env:GITHUB_WORKSPACE/build/obs-native-ci"}
          if ($env:NATIVE_PIXEL_TEST -eq 'true') { $parameters.PixelTest=$true }
          ./desktop/scripts/build-obs-native.ps1 @parameters
      - name: Freeze clean non-default prototype before generating any config
        if: ${{ !inputs.pixel_test }}
        shell: pwsh
        env:
          NATIVE_VERSION: ${{ inputs.version }}
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/runtime'
          if (Test-Path "$runtime/config") { throw 'Refuse to archive a configured runtime.' }
          $package = "build/obs-native-ci/WebOBS-OBS-native-$env:NATIVE_VERSION-windows-x64-PROTOTYPE.zip"
          Compress-Archive -Path "$runtime/*" -DestinationPath $package
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($package))" | Set-Content "$package.sha256" -Encoding utf8
      - name: Require the frozen prototype ZIP to run from a clean extraction
        if: ${{ !inputs.pixel_test }}
        shell: pwsh
        env:
          NATIVE_VERSION: ${{ inputs.version }}
        run: |
          $zip = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/WebOBS-OBS-native-*-PROTOTYPE.zip') | Select-Object -First 1
          if (-not $zip) { throw 'No frozen prototype archive to verify.' }
          $extract = Join-Path $env:RUNNER_TEMP 'native-portable-extract'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          if (Test-Path (Join-Path $extract 'config')) { throw 'Portable archive leaked a configured profile.' }
          python -B native-host/tests/smoke_windows.py --runtime $extract --result (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/native-portable-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Frozen portable ZIP startup/isolation smoke failed.' }
      - name: Install the frozen prototype twice and verify private config survives
        if: ${{ !inputs.pixel_test }}
        shell: pwsh
        env:
          NATIVE_VERSION: ${{ inputs.version }}
        run: |
          $zip = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/WebOBS-OBS-native-*-PROTOTYPE.zip') | Select-Object -First 1
          if (-not $zip) { throw 'No frozen prototype archive to install.' }
          $root = Join-Path $env:RUNNER_TEMP 'native-install'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          python -B native-host/scripts/install_native.py --package $zip.FullName --install-root $root --receipt (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/native-install-first.json')
          if ($LASTEXITCODE -ne 0) { throw 'Fresh private install failed.' }
          python -B native-host/tests/smoke_windows.py --runtime $root --result (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/native-install-smoke-first.json')
          if ($LASTEXITCODE -ne 0) { throw 'Fresh install smoke failed.' }
          python -B native-host/scripts/install_native.py --package $zip.FullName --install-root $root --receipt (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/native-install-second.json')
          if ($LASTEXITCODE -ne 0) { throw 'Reinstall over the private profile failed.' }
          python -B native-host/tests/smoke_windows.py --runtime $root --result (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/native-install-smoke-second.json') --existing-wall
          if ($LASTEXITCODE -ne 0) { throw 'Existing-wall smoke after reinstall failed.' }
      - name: Upgrade a pinned previous prototype and verify the private profile survives
        if: ${{ inputs.upgrade_previous && !inputs.pixel_test }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldRoot = Join-Path $env:RUNNER_TEMP 'native-upgrade-previous'
          if (Test-Path $oldRoot) { Remove-Item -Recurse -Force $oldRoot }
          gh run download 41220134972 --repo $env:GITHUB_REPOSITORY --name webobs-obs-native-prototype-4.1.0-dev.32 --dir $oldRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned previous prototype artifact download failed.' }
          $oldZip = Get-ChildItem $oldRoot -Filter '*.zip' | Select-Object -First 1
          if (-not $oldZip) { throw 'Pinned previous prototype artifact did not contain a ZIP.' }
          $root = Join-Path $env:RUNNER_TEMP 'native-upgrade'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          python -B native-host/scripts/install_native.py --package $oldZip.FullName --install-root $root --receipt build/obs-native-ci/native-upgrade-first.json
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned previous prototype failed.' }
          python -B native-host/tests/smoke_windows.py --runtime $root --result build/obs-native-ci/native-upgrade-first-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned previous prototype smoke failed.' }
          $configDir = Join-Path $root 'config/obs-studio'
          if (-not (Test-Path -LiteralPath $configDir -PathType Container)) { throw 'Pinned previous prototype did not create a private config directory.' }
          $before = Get-ChildItem -LiteralPath $configDir -Recurse -File | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($configDir.Length) + ':' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } | Out-String
          $zip = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'build/obs-native-ci/WebOBS-OBS-native-*-PROTOTYPE.zip') | Select-Object -First 1
          if (-not $zip) { throw 'No frozen prototype archive for the upgrade step.' }
          python -B native-host/scripts/install_native.py --package $zip.FullName --install-root $root --receipt build/obs-native-ci/native-upgrade-second.json
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade over the pinned previous prototype failed.' }
          $receipt = Get-Content -LiteralPath 'build/obs-native-ci/native-upgrade-second.json' -Raw | ConvertFrom-Json
          if ($receipt.version -ne $env:NATIVE_VERSION) { throw "Upgraded version $($receipt.version) does not match $env:NATIVE_VERSION." }
          if ($receipt.previousVersion -ne '4.1.0-dev.32') { throw "Unexpected previousVersion $($receipt.previousVersion)." }
          if ($receipt.configPreserved -ne $true) { throw 'Upgrade did not preserve the private profile.' }
          $after = Get-ChildItem -LiteralPath $configDir -Recurse -File | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($configDir.Length) + ':' + (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } | Out-String
          if ($before -ne $after) { throw 'Private config bytes changed across the upgrade.' }
          python -B native-host/tests/smoke_windows.py --runtime $root --result build/obs-native-ci/native-upgrade-second-smoke.json --existing-wall
          if ($LASTEXITCODE -ne 0) { throw 'Existing-wall smoke after cross-version upgrade failed.' }
      - name: Measure the stock OBS 32.1.2 installation for a same-OS size reference
        if: ${{ inputs.measure_obs_baseline && !inputs.pixel_test }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'obs-size-reference'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          $setup = Join-Path $env:RUNNER_TEMP 'OBS-Studio-32.1.2-Windows-x64-Installer.exe'
          Invoke-WebRequest -Uri 'https://github.com/obsproject/obs-studio/releases/download/32.1.2/OBS-Studio-32.1.2-Windows-x64-Installer.exe' -OutFile $setup
          $asset = Get-Item -LiteralPath $setup
          . ./desktop/tests/installed-tree-footprint.ps1
          $scope = New-InstalledTreeFootprintScope -Root $root -Purpose isolated-nsis-install-before-first-start
          $process = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$root" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Stock OBS silent install failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'bin/64bit/obs64.exe') -PathType Leaf)) { throw 'Stock OBS installer did not produce obs64.exe' }
          $footprint = Measure-InstalledTreeFootprint -Scope $scope
          $receipt = [ordered]@{
            schema = 1
            scope = 'reference-stock-obs-installation'
            obsVersion = '32.1.2'
            installerSha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            installerBytes = $asset.Length
            installed = $footprint
            qualification = 'GitHub-hosted Windows Server 2022 reference only; not a target-machine measurement and not an equal-feature scope'
          }
          $path = 'build/obs-native-ci/obs-size-reference.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $path
          Get-Content -LiteralPath $path
      - name: Require actual Qt plugin startup, private portable config and normal exit
        if: ${{ !inputs.pixel_test }}
        shell: pwsh
        run: |
          python -B native-host/tests/smoke_windows.py --runtime build/obs-native-ci/runtime --result build/obs-native-ci/native-startup-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Native frontend startup/isolation smoke failed; not camera or performance qualification.' }
      - name: Preserve sanitized synthetic final-pixel receipt only, never the test runtime
        if: always() && inputs.pixel_test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webobs-obs-native-final-pixels-${{ inputs.version }}
          path: build/obs-native-ci/native-final-pixels.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve clean prototype and bounded receipts only
        if: always() && !inputs.pixel_test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webobs-obs-native-prototype-${{ inputs.version }}
          path: |
            build/obs-native-ci/WebOBS-OBS-native-*-windows-x64-PROTOTYPE.zip
            build/obs-native-ci/*.sha256
            build/obs-native-ci/runtime/webobs-native-prototype.json
            build/obs-native-ci/native-startup-smoke.json
            build/obs-native-ci/native-portable-smoke.json
            build/obs-native-ci/native-install-first.json
            build/obs-native-ci/native-install-second.json
            build/obs-native-ci/native-install-smoke-first.json
            build/obs-native-ci/native-install-smoke-second.json
            build/obs-native-ci/native-upgrade-first.json
            build/obs-native-ci/native-upgrade-first-smoke.json
            build/obs-native-ci/native-upgrade-second.json
            build/obs-native-ci/native-upgrade-second-smoke.json
            build/obs-native-ci/obs-size-reference.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Preserve verified archives after compile failures
        if: always() && !cancelled() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: desktop/.cache/*.zip
          key: windows-2022-obs-native-${{ hashFiles('desktop/dependencies.lock.json', 'native-host/dependencies.lock.json') }}
