name: Release preflight audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-global
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact remote dev or main tip
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == branch && ("$REF_NAME" == dev || "$REF_NAME" == main) ]]
          git fetch --no-tags origin "$REF_NAME"
          remote_sha="$(git rev-parse "origin/$REF_NAME")"
          [[ "$remote_sha" == "$GITHUB_SHA" ]]

      - name: Audit public source and deterministic Web build
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-executable-bits.sh
          ./tests/run-public-audit.sh
          python3 ./clients/scripts/verify_dependency_lock.py
          python3 ./clients/tests/test_release_workflow_policy.py
          python3 ./clients/tests/test_local_gate_receipts.py
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          cd web
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:iwa
          pnpm build

      - name: Record the local-only publication boundary
        shell: bash
        run: |
          echo "This workflow does not build, sign, tag, or push an OCI image."
          echo "Run both revision-bound local gates, then use scripts/release-image-local.ps1 or scripts/release-image-local.sh."
