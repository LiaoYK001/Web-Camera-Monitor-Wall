name: Web runtime public CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-runtime-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with: { node-version: 24.14.0 }
      - name: Audit and build the public PWA
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          ./tests/run-public-audit.sh
          python3 ./clients/scripts/verify_dependency_lock.py
          python3 ./clients/tests/test_release_workflow_policy.py
          python3 ./clients/tests/test_local_gate_receipts.py
          cd web
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:iwa
          pnpm build

      - name: Explain private platform gates
        shell: bash
        run: |
          echo "Release media gates intentionally run on the maintainer's local WSL2 Linux and Windows hosts."
          echo "No untrusted repository code is dispatched to a self-hosted runner."
