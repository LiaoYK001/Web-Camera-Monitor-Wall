name: Web runtime public CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      windows_desktop:
        description: 'Also compile the full unsigned Windows desktop candidate'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: web-runtime-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-control-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Renderer-free authorization and read-only legacy import / 无渲染认证与旧配置只读预检
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsqlite3-dev libcurl4-openssl-dev libjansson-dev pkg-config
          cmake -S native-host/tests/control-auth -B build/native-control-auth -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-control-auth --parallel 2
          ctest --test-dir build/native-control-auth --output-on-failure
          python3 -B native-host/tests/test_legacy_import.py
  native-private-staging-contracts:
    name: Offline private staging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Verify private offline copies without OBS or network / 无宿主无网络验证私密离线副本
        shell: bash
        run: |
          set -euo pipefail
          python -B native-host/tests/test_legacy_stage_document.py
          python -B native-host/tests/test_private_stage.py
          python -B native-host/tests/test_legacy_stage.py
  windows-native-control-contracts:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          path: build/native-auth-vcpkg
          persist-credentials: false
      - name: Compile authorization without OBS and exercise Windows import safety / 独立编译认证并验证 Windows 迁移安全
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $PWD 'build/native-auth-vcpkg'
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg bootstrap failed.' }
          cmake -S native-host/tests/control-auth -B build/native-control-auth -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_MANIFEST_DIR=$PWD/native-host/tests/control-auth-vcpkg" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Standalone authorization configure failed.' }
          cmake --build build/native-control-auth --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Standalone authorization build failed.' }
          ctest --test-dir build/native-control-auth -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native authorization regressions failed.' }
          python -B native-host/tests/test_legacy_import.py
          if ($LASTEXITCODE -ne 0) { throw 'Read-only legacy import regressions failed.' }
  native-graph-api-contracts:
    name: Native graph API contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Fetch only fixed OBS headers / 仅获取固定 OBS headers
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 obs/obs-studio
          python -c 'import json, subprocess; from pathlib import Path; pin=json.loads(Path("desktop/dependencies.lock.json").read_text())["obsCommit"]; actual=subprocess.check_output(["git", "-C", "obs/obs-studio", "rev-parse", "HEAD"], text=True).strip(); assert actual == pin, "OBS header pin mismatch"'
      - name: Configure Linux API doubles / 配置 Linux API 替身
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsimde-dev
          cmake -S native-host -B build/native-graph-api -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEBOBS_NATIVE_BUILD_PLUGIN=OFF -DWEBOBS_NATIVE_BUILD_TESTS=ON
      - name: Configure MSVC x64 API doubles / 配置 MSVC x64 API 替身
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native-host -B build/native-graph-api -G 'Visual Studio 17 2022' -A x64 -DWEBOBS_NATIVE_BUILD_PLUGIN=OFF -DWEBOBS_NATIVE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native graph API configure failed.' }
      - name: Verify source ownership without media / 验证源所有权且不启动媒体
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native-graph-api --config Release --parallel 2 --verbose
          ctest --test-dir build/native-graph-api -C Release --output-on-failure
  windows-update-contracts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24 action runtime
        with: { node-version: 24.19.0, package-manager-cache: false }
      - name: Install pinned updater dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@11.16.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm --dir desktop install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Patch integrity, confirmation and real updater fallback / 补丁校验确认与更新回退
        shell: pwsh
        run: |
          pnpm --dir desktop audit --audit-level=low
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency audit failed' }
          pnpm --dir desktop test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop contracts failed' }
          pnpm --dir desktop test:updates
          if ($LASTEXITCODE -ne 0) { throw 'Real updater protocol failed' }
  windows-desktop-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_desktop
    permissions:
      # GitHub validates every nested callee, even skipped publication jobs.
      # This is only the optional reusable-call ceiling: its build jobs remain
      # read-only; official=false and no publication inputs are passed below.
      contents: write
      actions: read # The reusable workflow reads immutable candidate artifacts.
    uses: ./.github/workflows/windows-desktop.yaml
    with:
      version: '4.0.0-dev.0'
      milestone: 'v4-M1-dev'
      official: false
  public-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; node24 action runtime
        with: { node-version: 24.19.0, package-manager-cache: false }
      - name: Camera HTTP, credentials and notification security regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsodium23 ffmpeg
          python3 tests/test_camera_registry.py
          python3 tests/test_event_service.py
          python3 tests/test_v2_client_control.py
          python3 tests/test_cluster_service.py
          python3 tests/test_nvr_storage.py
          python3 tests/test_nvr_evidence.py
          python3 tests/test_nvr_media.py
          python3 tests/test_online_source.py
          python3 tests/test_public_source_qualification.py
          python3 tests/test_container_entrypoint.py
          python3 tests/test_release_identity.py
          python3 tests/test_go2rtc_runtime.py
      - name: Audit and build the public PWA
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          ./tests/run-public-audit.sh
          python3 ./clients/scripts/verify_dependency_lock.py
          python3 ./clients/tests/test_release_workflow_policy.py
          python3 ./clients/tests/test_local_gate_receipts.py
          cd web
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=low
          pnpm go2rtc:ui
          pnpm test:go2rtc-assets
          pnpm typecheck
          pnpm test:iwa
          pnpm build

      - name: Browser performance and audio regressions / 浏览器性能与音频回归
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test -c playwright.local.config.ts --project=chromium performance.spec.ts polling-performance.spec.ts peer-stats-performance.spec.ts control-recovery.spec.ts request-deadline.spec.ts sync-runtime.spec.ts sync-resilience.spec.ts offline-workspace.spec.ts program-snapshot.spec.ts nvr-evidence.spec.ts settings-details.spec.ts about-updates.spec.ts native-update-work.spec.ts interaction-flow.spec.ts mixer-runtime.spec.ts audio-preferences.spec.ts playback-optimization-runtime.spec.ts online-sources.spec.ts device-controls.spec.ts camera-registry-recovery.spec.ts scenes-go2rtc-optimization.spec.ts go2rtc-config-save.spec.ts

      - name: Management, archive, continuity and support contracts / 管理归档连续性与支持报告契约
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          # The continuity suite builds the dedicated vite.pwa-test.config.ts bundle
          # (production shell + service worker + test-only seed entry) before running.
          pnpm test:management
          pnpm test:archive
          pnpm test:continuity
          pnpm test:support-diagnostics

      - name: Explain private platform gates
        shell: bash
        run: |
          echo "Release media gates intentionally run on the maintainer's local WSL2 Linux and Windows hosts."
          echo "No untrusted repository code is dispatched to a self-hosted runner."
