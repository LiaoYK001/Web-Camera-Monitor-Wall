services:
  webobs:
    environment:
      WEBOBS_ALLOW_INSECURE_REMOTE: "false"
      WEBOBS_CLUSTER_ENABLED: "true"
      WEBOBS_COMPAT_BASIC_AUTH: "false"
      WEBOBS_AUTH_FAILURE_LIMIT: ${WEBOBS_AUTH_FAILURE_LIMIT:-5}
      WEBOBS_AUTH_FAILURE_WINDOW_SECONDS: ${WEBOBS_AUTH_FAILURE_WINDOW_SECONDS:-60}
      # Loopback-only HTTP compatibility. Production HTTPS keeps Secure=true.
      WEBOBS_SESSION_COOKIE_SECURE: "false"
      WEBOBS_CONTROL_ALLOWED_ORIGINS: ${WEBOBS_CONTROL_ALLOWED_ORIGINS:-}
