plugins { id 'com.android.application' }

android {
    namespace 'io.github.liaoyk001.webobs.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.liaoyk001.webobs.android'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(providers.gradleProperty('webobsVersionCode').getOrElse('3050001'))
        versionName providers.gradleProperty('webobsVersion').getOrElse('3.5.0-dev.android.1')
    }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
