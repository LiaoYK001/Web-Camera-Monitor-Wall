packages:
  - .
allowBuilds:
  electron: true
  electron-winstaller: false
overrides:
  # sprintf-js has no published fix; global-agent 4.1.3 drops roarr entirely.
  # patches/global-agent@4.1.3.patch restores proxied TLS options (see docs/dependency-security.md).
  '@electron/get@3.1.0>global-agent': 4.1.3
  http-cache-semantics: 4.3.0
patchedDependencies:
  global-agent@4.1.3: patches/global-agent@4.1.3.patch
